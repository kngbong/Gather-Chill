name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download and Setup Dalamud
        shell: pwsh
        run: |
          $dalamudPath = "$env:RUNNER_TEMP\dalamud"
          New-Item -ItemType Directory -Force -Path $dalamudPath
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath $dalamudPath -Force
          echo "DALAMUD_HOME=$dalamudPath" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore GatherChill/GatherChill.csproj

      - name: Build Plugin (Release)
        run: dotnet build GatherChill/GatherChill.csproj --configuration Release --no-restore

      - name: Prepare Release Assets
        id: prepare_assets
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content "GatherChill/GatherChill.csproj"
          $ver = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $ver) { $ver = "1.0.0.0" }
          echo "tag=v$ver" >> $env:GITHUB_OUTPUT

          $packagerZip = "GatherChill/bin/Release/GatherChillFork/latest.zip"
          if (-not (Test-Path $packagerZip)) {
              $packagerZip = "GatherChill/bin/x64/Release/GatherChillFork/latest.zip"
          }
          if (-not (Test-Path $packagerZip)) {
              throw "Packaged zip not found"
          }

          Copy-Item $packagerZip "GatherChillFork.zip" -Force
          Copy-Item $packagerZip "latest.zip" -Force

          $jsonFile = "GatherChill/bin/Release/GatherChillFork/GatherChillFork.json"
          if (-not (Test-Path $jsonFile)) {
              $jsonFile = "GatherChill/bin/x64/Release/GatherChillFork/GatherChillFork.json"
          }
          if (Test-Path $jsonFile) {
              Copy-Item $jsonFile "GatherChillFork.json" -Force
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag }}
          name: Release ${{ steps.prepare_assets.outputs.tag }}
          files: |
            GatherChillFork.zip
            latest.zip
            GatherChillFork.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
